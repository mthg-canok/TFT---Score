<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo Dõi Giải Đấu TFT (Khán Giả Live)</title>
    <script type="module">
        // 1. Nhập các công cụ cần thiết từ kho lưu trữ của Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 2. Cấu hình Firebase của bạn (Mình đã thêm dòng databaseURL cho bạn)
        const firebaseConfig = {
            apiKey: "AIzaSyBqnSskFjMQ4l8iEc8_lO8Wt3HJM_SoSK0",
            authDomain: "tft-score.firebaseapp.com",
            databaseURL: "https://tft-score-default-rtdb.firebaseio.com", // Đừng bỏ quên dòng này nhé!
            projectId: "tft-score",
            storageBucket: "tft-score.firebasestorage.app",
            messagingSenderId: "184916652079",
            appId: "1:184916652079:web:9f10bba4009faf9b8716da",
            measurementId: "G-PQ8X5TK37R"
        };

        // 3. Kích hoạt Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Khai báo biến db ra toàn cục (global) để các hàm JS khác của bạn có thể gọi được
        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
    </script>
    <style>
        :root { --bg-main: #0b0f19; --accent-color: #38bdf8; --accent-gold: #f59e0b; --board-bg: #eaddca; --header-bg: #1c1510; --text-light: #ffffff; --text-dark: #1c1510; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-main); color: #f8fafc; padding: 20px; }
        .max-width-container { max-width: 1600px; margin: 0 auto; }
        h1 { text-align: center; color: var(--accent-color); text-transform: uppercase; }
        .live-indicator { text-align: center; color: #10b981; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
        .tabs-nav { display: flex; border-bottom: 2px solid #1f2937; margin: 20px 0; gap: 40px; }
        .tab-btn { background: none; border: none; color: #64748b; font-size: 1.25rem; font-weight: bold; padding: 12px 5px; cursor: pointer; position: relative; }
        .tab-btn.active { color: var(--accent-gold); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 4px; background: var(--accent-gold); }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .group-title { background: rgba(255,255,255,0.05); padding: 10px 15px; border-left: 4px solid var(--accent-color); margin: 30px 0 15px 0; font-size: 1.3rem; font-weight: bold; }
        .teams-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .team-card { background: var(--board-bg); border-radius: 8px; overflow: hidden; color: var(--text-dark); }
        .team-header { background: var(--header-bg); color: var(--text-light); padding: 12px 16px; display: flex; justify-content: space-between; font-weight: bold; }
        .total-score-bar { background: #f4eae1; padding: 8px 16px; display: flex; justify-content: space-between; font-weight: bold; border-bottom: 2px solid #dfd4c0; }
        .total-score-value { font-size: 1.2rem; color: #962d2d; }
        .player-row { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid #dfd4c0; background: #f5ebd9; }
        .player-row.top-1 { background: #edf5eb; } .player-row.top-2 { background: #e2ede4; }
        .rank-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; margin-right: 12px; }
        .rank-1 { background: #2d5a27; } .rank-2 { background: #528265; } .rank-other { border: 2px solid #bfae96; color: #7a6b58; }
        .player-info { flex-grow: 1; } .player-name { font-weight: bold; } .player-score { font-size: 1.2rem; font-weight: bold; }
        .bracket-container { display: grid; grid-template-columns: repeat(5, minmax(250px, 1fr)); gap: 15px; overflow-x: auto; }
        .bracket-col { background: rgba(17,24,39,0.4); border: 1px solid #1f2937; border-radius: 10px; padding: 12px; }
        .col-header { text-align: center; font-size: 0.85rem; font-weight: 900; color: #64748b; margin-bottom: 12px; }
        .group-section { margin-bottom: 18px; background: rgba(15,23,42,0.6); border-radius: 8px; padding: 10px; border: 1px solid #1e293b; }
        .group-title-sub { font-size: 0.8rem; font-weight: 800; color: #e2e8f0; margin-bottom: 8px; }
        .match-card { background: #0b0f19; border: 1px solid #1f2937; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        .team-row { display: flex; justify-content: space-between; padding: 7px 10px; font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .team-row.winner { background: rgba(16,185,129,0.15); color: #34d399; border-left: 3px solid #10b981; }
        .score-badge { background: #1e293b; color: #f8fafc; padding: 2px 7px; border-radius: 4px; }
        .winner .score-badge { background: #f59e0b; color: #000; }
        .status-banner { text-align: center; font-weight: 900; font-size: 0.9rem; padding: 8px; border-radius: 6px; margin-bottom: 10px; }
        .banner-qual { background: rgba(245,158,11,0.2); border: 1px solid #f59e0b; color: #fbbf24; }
        .banner-elim { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #f87171; }
        .status-tag { background: #0b0f19; padding: 8px 10px; border-radius: 5px; margin-bottom: 6px; display: flex; justify-content: space-between; font-weight: bold; }
        .tag-qual { border-left: 3px solid #f59e0b; color: #f8fafc; } .tag-elim { border-left: 3px solid #ef4444; color: #64748b; text-decoration: line-through; }
    </style>
</head>
<body>
<div class="max-width-container">
    <h1>🏆 THEO DÕI GIẢI ĐẤU TFT (KHÁN GIẢ LIVE) 🏆</h1>
    <div class="live-indicator"><span class="dot"></span> Tự động đồng bộ không cần F5</div>

    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('tab-leaderboard', this)">01 Bảng xếp hạng vòng bảng</button>
        <button class="tab-btn" onclick="switchTab('tab-bracket', this)">02 Sơ đồ nhánh đấu</button>
    </div>

    <div id="tab-leaderboard" class="tab-content active">
        <div class="group-title">🔥 BẢNG A</div><div class="teams-grid" id="container-group-A"></div>
        <div class="group-title">⚡ BẢNG B</div><div class="teams-grid" id="container-group-B"></div>
    </div>

    <div id="tab-bracket" class="tab-content">
        <div class="bracket-container">
            <div class="bracket-col"><div class="col-header">ROUND 1</div><div class="group-section"><div class="group-title-sub">GROUP 0-0</div><div id="col1-matches"></div></div></div>
            <div class="bracket-col"><div class="col-header">ROUND 2</div><div class="group-section"><div class="group-title-sub" style="color:#34d399;">GROUP 1-0</div><div id="col2-matches-10"></div></div><div class="group-section"><div class="group-title-sub" style="color:#f87171;">GROUP 0-1</div><div id="col2-matches-01"></div></div></div>
            <div class="bracket-col"><div class="col-header">ROUND 3</div><div class="group-section"><div class="group-title-sub" style="color:#fbbf24;">GROUP 2-0</div><div id="col3-matches-20"></div></div><div class="group-section"><div class="group-title-sub" style="color:#38bdf8;">GROUP 1-1</div><div id="col3-matches-11"></div></div></div>
            <div class="bracket-col"><div class="col-header">ROUND 4</div><div class="status-banner banner-qual">✨ QUALIFIED ✨</div><div id="col4-qual-20"></div><div class="status-banner banner-elim" style="margin-top:15px;">❌ ELIMINATED ❌</div><div id="col4-elim-02"></div></div>
            <div class="bracket-col"><div class="col-header">RESULTS</div><div class="status-banner banner-qual">✨ CHUNG CUỘC ✨</div><div id="col5-qual-final"></div><div class="status-banner banner-elim" style="margin-top:15px;">❌ BỊ LOẠI ❌</div><div id="col5-elim-final"></div></div>
        </div>
    </div>
</div>

<script>
function switchTab(id, btn) {
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active'); btn.classList.add('active');
}

const ViewerApp = {
    init() {
        this.teams = []; this.players = []; this.customOrder = [];
        
        // [Lệnh Cloud] - Lắng nghe thay đổi từ Firebase theo thời gian thực
        setTimeout(() => {
            if(window.db) {
                const dbRef = window.ref(window.db, 'TFT_TOURNAMENT_DATA');
                window.onValue(dbRef, (snapshot) => {
                    const data = snapshot.val();
                    if(!data) {
                        document.getElementById('container-group-A').innerHTML = '<p style="color:#64748b; padding:20px;">Đang chờ Ban tổ chức kích hoạt giải đấu...</p>';
                        return;
                    }
                    this.teams = data.teams || [];
                    this.players = data.players || [];
                    this.customOrder = data.customOrder || [];
                    this.renderLeaderboards();
                    this.renderBracket();
                });
            } else {
                console.error("Lỗi: Firebase chưa sẵn sàng.");
            }
        }, 500);
    },
    
    renderLeaderboards() {
        ['A','B'].forEach(g => {
            const cont = document.getElementById(`container-group-${g}`); if(!cont) return; cont.innerHTML = '';
            this.teams.filter(t=>t.group===g).forEach(tm => {
                const pls = this.players.filter(p=>p.teamId===tm.id).sort((a,b)=>b.score-a.score);
                const sum = pls.reduce((a,b)=>a+b.score,0);
                let html = `<div class="team-card"><div class="team-header"><span>${tm.name}</span><span>BẢNG ${g}</span></div><div class="total-score-bar"><span>Tổng điểm:</span><span class="total-score-value">${sum} ĐH</span></div>`;
                pls.forEach((p, i) => html += `<div class="player-row ${i===0?'top-1':(i===1?'top-2':'')}"><div class="rank-badge ${i===0?'rank-1':(i===1?'rank-2':'rank-other')}">${i+1}</div><div class="player-info"><div class="player-name">${p.name}</div></div><div class="player-score">${p.score}</div></div>`);
                cont.innerHTML += html + `</div>`;
            });
        });
    },

    renderBracket() {
        const getSc = (tName, rNum) => {
            const tm = this.teams.find(t => t.name === tName);
            if(!tm) return 0;
            return this.players.filter(p => p.teamId === tm.id).reduce((sum, p) => sum + (rNum===1?p.r1:(rNum===2?p.r2:p.r3)), 0);
        };
        const formatTeamName = (tName) => { const tm = this.teams.find(t => t.name === tName); return tm ? `${tm.group}-${tName}` : tName; };
        const match = (t1, t2, rNum) => {
            if (!t1 || !t2) return '';
            const s1 = getSc(t1, rNum), s2 = getSc(t2, rNum);
            const isPlayed = rNum === 1 ? (s1 > 0 || s2 > 0) : (rNum === 2 ? (getSc(t1, 2) > 0 || getSc(t2, 2) > 0) : (getSc(t1, 3) > 0 || getSc(t2, 3) > 0));
            const w1 = isPlayed && s1 >= s2 ? 'winner' : '', w2 = isPlayed && s2 > s1 ? 'winner' : '';
            return `<div class="match-card"><div class="team-row ${w1}"><span>${formatTeamName(t1)}</span><span class="score-badge">${isPlayed ? s1 + 'đ' : 'Chờ đấu'}</span></div><div class="team-row ${w2}"><span>${formatTeamName(t2)}</span><span class="score-badge">${isPlayed ? s2 + 'đ' : 'Chờ đấu'}</span></div></div>`;
        };

        const t = (i) => this.customOrder && this.customOrder[i] ? this.customOrder[i] : (this.teams[i] ? this.teams[i].name : `Đội ${i+1}`);
        const r1_pairs = [ [t(0), t(1)], [t(2), t(3)], [t(4), t(5)], [t(6), t(7)] ];
        const totalR1 = r1_pairs.reduce((acc, p) => acc + getSc(p[0], 1) + getSc(p[1], 1), 0);

        const r1_cont = document.getElementById('col1-matches');
        if (r1_cont) { r1_cont.innerHTML = r1_pairs.map(p => match(p[0], p[1], 1)).join(''); }

        if (totalR1 === 0) {
            document.getElementById('col2-matches-10').innerHTML = '<p style="color:#64748b;font-size:0.8rem;text-align:center;">Chờ kết quả Vòng 1...</p>';
            document.getElementById('col2-matches-01').innerHTML = '<p style="color:#64748b;font-size:0.8rem;text-align:center;">Chờ kết quả Vòng 1...</p>';
            document.getElementById('col3-matches-20').innerHTML = ''; document.getElementById('col3-matches-11').innerHTML = '<p style="color:#64748b;font-size:0.8rem;text-align:center;">Chờ kết quả Vòng 2...</p>';
            document.getElementById('col4-qual-20').innerHTML = ''; document.getElementById('col4-elim-02').innerHTML = '';
            if(document.getElementById('col5-qual-final')) document.getElementById('col5-qual-final').innerHTML = '';
            if(document.getElementById('col5-elim-final')) document.getElementById('col5-elim-final').innerHTML = '';
            return;
        }

        let win_R1 = [], lose_R1 = [];
        r1_pairs.forEach(p => { if (getSc(p[0], 1) >= getSc(p[1], 1)) { win_R1.push(p[0]); lose_R1.push(p[1]); } else { win_R1.push(p[1]); lose_R1.push(p[0]); } });

        const r2_10 = [ [win_R1[0], win_R1[1]], [win_R1[2], win_R1[3]] ];
        const r2_01 = [ [lose_R1[0], lose_R1[1]], [lose_R1[2], lose_R1[3]] ];
        document.getElementById('col2-matches-10').innerHTML = r2_10.map(p => match(p[0], p[1], 2)).join('');
        document.getElementById('col2-matches-01').innerHTML = r2_01.map(p => match(p[0], p[1], 2)).join('');

        const totalR2 = r2_10.reduce((a, p) => a + getSc(p[0], 2) + getSc(p[1], 2), 0) + r2_01.reduce((a, p) => a + getSc(p[0], 2) + getSc(p[1], 2), 0);
        if (totalR2 === 0) {
            document.getElementById('col3-matches-20').innerHTML = '<p style="color:#64748b;font-size:0.8rem;text-align:center;">Chờ thi đấu Vòng 2...</p>';
            document.getElementById('col3-matches-11').innerHTML = '<p style="color:#64748b;font-size:0.8rem;text-align:center;">Chờ thi đấu Vòng 2...</p>';
            document.getElementById('col4-qual-20').innerHTML = ''; document.getElementById('col4-elim-02').innerHTML = '';
            if(document.getElementById('col5-qual-final')) document.getElementById('col5-qual-final').innerHTML = '';
            if(document.getElementById('col5-elim-final')) document.getElementById('col5-elim-final').innerHTML = '';
            return;
        }

        let qual_20 = [], elim_02 = [], grp_11 = [];
        r2_10.forEach(p => { if (getSc(p[0], 2) >= getSc(p[1], 2)) { qual_20.push(p[0]); grp_11.push(p[1]); } else { qual_20.push(p[1]); grp_11.push(p[0]); } });
        r2_01.forEach(p => { if (getSc(p[0], 2) >= getSc(p[1], 2)) { grp_11.push(p[0]); elim_02.push(p[1]); } else { grp_11.push(p[1]); elim_02.push(p[0]); } });

        document.getElementById('col3-matches-20').innerHTML = qual_20.map(name => `<div class="status-tag tag-qual"><span>✨ ${formatTeamName(name)} (2-0)</span><span>${getSc(name, 1)+getSc(name, 2)}đ</span></div>`).join('');
        document.getElementById('col4-qual-20').innerHTML = qual_20.map(name => `<div class="status-tag tag-qual"><span>🏆 ${formatTeamName(name)}</span></div>`).join('');
        document.getElementById('col4-elim-02').innerHTML = elim_02.map(name => `<div class="status-tag tag-elim"><span>❌ ${formatTeamName(name)} (0-2)</span></div>`).join('');

        const r3_11 = [ [grp_11[0], grp_11[1]], [grp_11[2], grp_11[3]] ];
        document.getElementById('col3-matches-11').innerHTML = r3_11.map(p => match(p[0], p[1], 3)).join('');

        const totalR3 = r3_11.reduce((a, p) => a + getSc(p[0], 3) + getSc(p[1], 3), 0);
        if (totalR3 === 0) {
            if(document.getElementById('col5-qual-final')) document.getElementById('col5-qual-final').innerHTML = '<p style="color:#64748b;font-size:0.8rem;text-align:center;">Chờ thi đấu Vòng 3...</p>';
            if(document.getElementById('col5-elim-final')) document.getElementById('col5-elim-final').innerHTML = '';
            return;
        }

        let f_qual = [...qual_20], f_elim = [...elim_02];
        r3_11.forEach(p => { if (getSc(p[0], 3) >= getSc(p[1], 3)) { f_qual.push(`${p[0]} (2-1)`); f_elim.push(`${p[1]} (1-2)`); } else { f_qual.push(`${p[1]} (2-1)`); f_elim.push(`${p[0]} (1-2)`); } });

        if(document.getElementById('col5-qual-final')) {
            document.getElementById('col5-qual-final').innerHTML = f_qual.map(tInfo => {
                let name = tInfo.split(' (')[0], suffix = ' (' + tInfo.split(' (')[1];
                return `<div class="status-tag tag-qual"><span>🎉 ${formatTeamName(name)}${suffix}</span></div>`;
            }).join('');
        }
        if(document.getElementById('col5-elim-final')) {
            document.getElementById('col5-elim-final').innerHTML = f_elim.map(tInfo => {
                let name = tInfo.split(' (')[0], suffix = ' (' + tInfo.split(' (')[1];
                return `<div class="status-tag tag-elim"><span>❌ ${formatTeamName(name)}${suffix}</span></div>`;
            }).join('');
        }
    }
};
ViewerApp.init();
</script>
</body>
</html>
